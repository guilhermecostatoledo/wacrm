name: Publish container image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag, for example 0.9.0-rc.1
        required: true
        type: string
      supabase_url:
        description: Public Supabase project URL compiled into the browser bundle
        required: true
        type: string
      supabase_anon_key:
        description: Public Supabase anonymous key compiled into the browser bundle
        required: true
        type: string
      site_url:
        description: Canonical public HTTPS URL, without trailing slash
        required: true
        type: string
      app_locale:
        description: Message dictionary locale available under messages/
        required: true
        default: en
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          pull: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ inputs.image_tag }}
            ${{ steps.image.outputs.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=WACRM
            org.opencontainers.image.description=WhatsApp-focused CRM built with Next.js and Supabase
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ inputs.supabase_url }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ inputs.supabase_anon_key }}
            NEXT_PUBLIC_SITE_URL=${{ inputs.site_url }}
            NEXT_PUBLIC_APP_LOCALE=${{ inputs.app_locale }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        run: |
          {
            echo '## Container published'
            echo
            echo '```text'
            echo '${{ steps.image.outputs.repository }}:${{ inputs.image_tag }}'
            echo '```'
            echo
            echo 'Deploy this immutable tag and inject runtime-only secrets through Docker/Portainer environment variables.'
          } >> "$GITHUB_STEP_SUMMARY"
